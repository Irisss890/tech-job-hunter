  </text>

  <!-- Step 1 -->
  <g transform="translate(50, 100)">
    <rect width="190" height="130" rx="12" fill="url(#boxGrad)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5"/>
    <rect x="15" y="15" width="30" height="30" rx="6" fill="rgba(6, 182, 212, 0.2)"/>
    <text x="23" y="35" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="800">1</text>
    <text x="15" y="70" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">500+ Multi-Source</text>
    <text x="15" y="88" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Job Aggregator</text>
    <text x="15" y="110" fill="#94a3b8" font-family="sans-serif" font-size="11">Tech, Auto, Marketing, MNC</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 255 165 L 285 165" stroke="url(#arrowGrad)" stroke-width="3" marker-end="url(#arrowhead)"/>
  <polygon points="285,160 295,165 285,170" fill="#06b6d4"/>

  <!-- Step 2 -->
  <g transform="translate(305, 100)">
    <rect width="190" height="130" rx="12" fill="url(#boxGrad)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5"/>
    <rect x="15" y="15" width="30" height="30" rx="6" fill="rgba(99, 102, 241, 0.2)"/>
    <text x="23" y="35" fill="#818cf8" font-family="sans-serif" font-size="14" font-weight="800">2</text>
    <text x="15" y="70" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Specialization</text>
    <text x="15" y="88" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">&amp; Industry Tabs</text>
    <text x="15" y="110" fill="#94a3b8" font-family="sans-serif" font-size="11">Agentic AI, ML, DA, MNCs</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 510 165 L 540 165" stroke="url(#arrowGrad)" stroke-width="3"/>
  <polygon points="540,160 550,165 540,170" fill="#06b6d4"/>

  <!-- Step 3 -->
  <g transform="translate(560, 100)">
    <rect width="190" height="130" rx="12" fill="url(#boxGrad)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    <rect x="15" y="15" width="30" height="30" rx="6" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="23" y="35" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="800">3</text>
    <text x="15" y="70" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Internship Chance</text>
    <text x="15" y="88" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Score Engine</text>
    <text x="15" y="110" fill="#94a3b8" font-family="sans-serif" font-size="11">Skill Alignment % Algorithm</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 765 165 L 795 165" stroke="url(#arrowGrad)" stroke-width="3"/>
  <polygon points="795,160 805,165 795,170" fill="#06b6d4"/>

