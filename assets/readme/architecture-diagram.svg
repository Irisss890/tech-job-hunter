  <g transform="translate(1040, 100)">
    <rect width="110" height="130" rx="12" fill="url(#boxGrad)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.5"/>
    <rect x="15" y="15" width="30" height="30" rx="6" fill="rgba(59, 130, 246, 0.2)"/>
    <text x="23" y="35" fill="#60a5fa" font-family="sans-serif" font-size="14" font-weight="800">5</text>
    <text x="15" y="70" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Sheets CSV</text>
    <text x="15" y="88" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Exporter</text>
    <text x="15" y="110" fill="#94a3b8" font-family="sans-serif" font-size="11">1-Click Export</text>
