    <rect x="15" y="15" width="30" height="30" rx="6" fill="rgba(245, 158, 11, 0.2)"/>
    <text x="23" y="35" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="800">4</text>
    <text x="15" y="70" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Cold Email</text>
    <text x="15" y="88" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Generator</text>
    <text x="15" y="110" fill="#94a3b8" font-family="sans-serif" font-size="11">Tailored HR Outreach</text>
